
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سمیع الله نوری</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#20283a}
.banner{background:linear-gradient(135deg,#087e8b,#153d75);color:white;text-align:center;padding:35px 15px;font-size:23px;font-weight:bold}
main{max-width:600px;margin:22px auto;padding:14px}
.card{background:white;padding:20px;border-radius:16px;box-shadow:0 5px 22px #00000010;margin-bottom:18px}
input,textarea,button{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:9px;font-size:16px;margin-top:9px}
button{background:#1558a6;color:white;border:0;cursor:pointer}
button:disabled{opacity:.6}
label{display:block;margin-top:14px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#101f40,#176c83);color:white;padding:23px 12px;text-align:center}
.brand h1{margin:0;font-size:25px;text-shadow:0 2px 5px #0005}
.brand .mark{width:43px;height:43px;border:2px solid #d8c17b;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f5d98b;font-size:22px}
.msg{border:1px solid #d8dee8;border-radius:10px;padding:12px;margin:12px 0;overflow-wrap:anywhere}
.reply{background:#e8f5e9;padding:10px;border-radius:8px;margin-top:10px}
.small{font-size:13px;color:#667085}
.hidden{display:none!important}
.danger{background:#b42318}
.secondary{background:#475467}
.status{overflow-wrap:anywhere;margin-top:12px}
footer{text-align:center;padding:20px;color:#667085;font-size:13px}
</style>
</head>
<body>

<!-- صفحه اول: فقط پیام انترنت -->
<section id="welcome">
  <div class="banner">یک جی‌بی انترنت برای یک ساعت در روز</div>
  <main>
    <div class="card">
      <label for="entryName">نام</label>
      <input id="entryName" maxlength="80" placeholder="نام خود را بنویسید">
      <label for="entryPhone">شماره تماس</label>
      <input id="entryPhone" type="tel" maxlength="30" placeholder="شماره تماس">
      <button id="enterBtn">ورود</button>
      <div id="entryStatus" class="status" role="status"></div>
    </div>
  </main>
</section>

<!-- صفحه بعد از ورود -->
<section id="inside" class="hidden">
  <header class="brand">
    <div class="mark">س</div>
    <h1>سمیع الله نوری</h1>
  </header>

  <div class="banner">یک جی‌بی انترنت برای یک ساعت در روز</div>

  <main>
    <div class="card">
      <h2>پیام به مدیر</h2>
      <div id="welcomeUser"></div>
      <label for="message">متن پیام</label>
      <textarea id="message" maxlength="2000" rows="4" placeholder="پیام خود را بنویسید"></textarea>
      <button id="sendBtn">ارسال پیام</button>
      <div id="status" class="status" role="status"></div>
    </div>

    <div class="card">
      <h2>پیام‌های من و پاسخ مدیر</h2>
      <div id="myMessages">در حال بارگذاری...</div>
    </div>

    <div class="card">
      <h2>ورود مدیر</h2>
      <label for="adminEmail">ایمیل مدیر</label>
      <input id="adminEmail" type="email" autocomplete="username" placeholder="ایمیل مدیر">
      <label for="adminPassword">رمز عبور</label>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="رمز عبور">
      <button id="loginBtn">ورود مدیر</button>
      <button id="logoutBtn" class="secondary hidden">خروج مدیر</button>
      <div id="adminStatus" class="status" role="status"></div>
    </div>

    <div id="adminPanel" class="card hidden">
      <h2>مدیریت پیام‌ها</h2>
      <div id="allMessages">در حال بارگذاری...</div>
    </div>

    <button id="backBtn" class="secondary">برگشت به صفحه اول</button>
  </main>
  <footer>سمیع الله نوری</footer>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth, signInAnonymously, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, where, onSnapshot,
  serverTimestamp, doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB55tsTKjUe6TfOtcXpoJmrIV5NWYXNFos",
  authDomain: "sami-web-2be7.firebaseapp.com",
  projectId: "sami-web-2be7",
  storageBucket: "sami-web-2be7.firebasestorage.app",
  messagingSenderId: "631995015062",
  appId: "1:631995015062:web:21dcfa50c6231168c907b7"
};

const ADMIN_UID = "n6ONAJkRIHYpv4pWALIDuAIXcTz1";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let currentUser = null;
let userName = "";
let userPhone = "";
let stopMessages = null;
let stopAdminMessages = null;

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function showStatus(message, admin=false) {
  $(admin ? "adminStatus" : "status").textContent = message;
}

function showInside() {
  $("welcome").classList.add("hidden");
  $("inside").classList.remove("hidden");
  $("welcomeUser").textContent = "خوش آمدید، " + userName;
}

$("enterBtn").addEventListener("click", async () => {
  userName = $("entryName").value.trim();
  userPhone = $("entryPhone").value.trim();

  if (!userName || !userPhone) {
    $("entryStatus").textContent = "لطفاً نام و شماره تماس را وارد کنید.";
    return;
  }

  $("enterBtn").disabled = true;
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    if (auth.currentUser?.uid === ADMIN_UID) {
      await signOut(auth);
      await signInAnonymously(auth);
    }
    currentUser = auth.currentUser;
    showInside();
    watchOwnMessages(currentUser);
    $("entryStatus").textContent = "";
  } catch (error) {
    $("entryStatus").textContent = "ورود انجام نشد. اتصال انترنت را بررسی کنید.";
  } finally {
    $("enterBtn").disabled = false;
  }
});

function watchOwnMessages(user) {
  if (stopMessages) stopMessages();
  const q = query(collection(db, "messages"), where("ownerUid", "==", user.uid));

  stopMessages = onSnapshot(q, snapshot => {
    const items = snapshot.docs.map(d => ({id:d.id,...d.data()}));
    items.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    $("myMessages").innerHTML = items.length ? items.map(m => `
      <div class="msg">
        <strong>پیام شما:</strong>
        <p>${safe(m.message)}</p>
        <div class="reply"><strong>پاسخ مدیر:</strong><br>
          ${m.reply ? safe(m.reply) : "هنوز پاسخی ثبت نشده است."}
        </div>
      </div>
    `).join("") : "هنوز پیامی نفرستاده‌اید.";
  }, () => {
    $("myMessages").textContent = "پیام‌ها بارگذاری نشدند. قوانین دیتابیس را بررسی می‌کنیم.";
  });
}

function watchAllMessages() {
  if (stopAdminMessages) stopAdminMessages();

  stopAdminMessages = onSnapshot(collection(db, "messages"), snapshot => {
    const items = snapshot.docs.map(d => ({id:d.id,...d.data()}));
    items.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    $("allMessages").innerHTML = items.length ? items.map(m => `
      <div class="msg">
        <strong>${safe(m.name)}</strong>
        <div class="small">شماره تماس: ${safe(m.phone || "ثبت نشده")}</div>
        <p>${safe(m.message)}</p>
        <label for="reply-${safe(m.id)}">پاسخ مدیر</label>
        <textarea id="reply-${safe(m.id)}" rows="3" maxlength="2000">${safe(m.reply || "")}</textarea>
        <button data-reply="${safe(m.id)}">ذخیره پاسخ</button>
        <button class="danger" data-delete="${safe(m.id)}">حذف پیام</button>
      </div>
    `).join("") : "هیچ پیامی ثبت نشده است.";
  }, () => {
    $("allMessages").textContent = "پیام‌ها بارگذاری نشدند. قوانین امنیتی را بررسی کنید.";
  });
}

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user?.uid === ADMIN_UID) {
    $("adminPanel").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    watchAllMessages();
    showStatus("ورود مدیر موفق بود.", true);
  } else {
    $("adminPanel").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    if (stopAdminMessages) stopAdminMessages();
    stopAdminMessages = null;
  }
});

$("sendBtn").addEventListener("click", async () => {
  if (!currentUser || currentUser.uid === ADMIN_UID) {
    showStatus("ابتدا از صفحه ورود کاربر وارد شوید.");
    return;
  }

  const message = $("message").value.trim();
  if (!message) {
    showStatus("لطفاً متن پیام را بنویسید.");
    return;
  }

  $("sendBtn").disabled = true;
  try {
    await addDoc(collection(db, "messages"), {
      ownerUid: currentUser.uid,
      name: userName,
      phone: userPhone,
      message,
      reply: "",
      repliedAt: null,
      createdAt: serverTimestamp()
    });
    $("message").value = "";
    showStatus("پیام شما ثبت شد.");
  } catch (error) {
    showStatus("پیام ثبت نشد؛ باید قوانین دیتابیس را تنظیم کنیم.");
  } finally {
    $("sendBtn").disabled = false;
  }
});

$("loginBtn").addEventListener("click", async () => {
  const email = $("adminEmail").value.trim();
  const password = $("adminPassword").value;

  if (!email || !password) {
    showStatus("ایمیل و رمز عبور را وارد کنید.", true);
    return;
  }

  $("loginBtn").disabled = true;
  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      showStatus("این حساب، حساب مدیر ثبت‌شده نیست.", true);
    }
  } catch {
    showStatus("ورود انجام نشد. ایمیل و رمز عبور را بررسی کنید.", true);
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    if (stopAdminMessages) stopAdminMessages();
    await signOut(auth);
    showStatus("از حساب مدیر خارج شدید.", true);
  } catch {
    showStatus("خروج انجام نشد.", true);
  }
});

$("allMessages").addEventListener("click", async event => {
  const replyBtn = event.target.closest("[data-reply]");
  const deleteBtn = event.target.closest("[data-delete]");

  if (replyBtn) {
    const id = replyBtn.dataset.reply;
    const reply = $("reply-" + id).value.trim();
    try {
      await updateDoc(doc(db, "messages", id), {
        reply,
        repliedAt: serverTimestamp()
      });
      showStatus("پاسخ ذخیره شد.", true);
    } catch {
      showStatus("پاسخ ذخیره نشد؛ قوانین امنیتی را بررسی می‌کنیم.", true);
    }
  }

  if (deleteBtn) {
    if (!confirm("آیا مطمئن هستید که پیام حذف شود؟")) return;
    try {
      await deleteDoc(doc(db, "messages", deleteBtn.dataset.delete));
      showStatus("پیام حذف شد.", true);
    } catch {
      showStatus("حذف پیام انجام نشد؛ قوانین امنیتی را بررسی می‌کنیم.", true);
    }
  }
});

$("backBtn").addEventListener("click", () => {
  $("inside").classList.add("hidden");
  $("welcome").classList.remove("hidden");
});
</script>
</body>
</html>
